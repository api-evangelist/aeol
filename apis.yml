aid: aeol
name: AEOL
description: 'AEOL (AEOL KOREA Co., Ltd. / 주식회사 에이올코리아) is a South Korean advanced-materials
  and climate-technology manufacturer founded in February 2018 out of the Korea University
  Campus Town programme and headquartered in Seongnam, Gyeonggi Province. The company holds a
  twenty-year exclusive licence from the Korea Research Institute of Chemical Technology to
  manufacture and sell Metal-Organic Framework (MOF) materials, and was the first Korean firm to
  commercialise MOF production at scale. It turns that porous-adsorbent chemistry into physical
  equipment: MOF desiccant rotors and hybrid dehumidifiers that regenerate at low temperature
  instead of using refrigerant compression, all-in-one units combining heat-recovery ventilation
  with UV-LED and HEPA air purification and auxiliary cooling, harmful-gas and odour adsorption
  products such as the Red Dot-awarded Mofresh Mini, and the CarbonSorV rotary wheel for
  continuous CO2 capture shown at CES 2025. AEOL won a CES 2024 Innovation Award and the FIX 2024
  Grand Innovation Award, has raised roughly USD 10-23 million from investors including KU
  Startup, BlissVine Ventures, JCGI, KNET Investment Partners and NH Venture Investment, and sells
  through appliance-maker R&D partnerships and distribution agreements in North America and New
  Zealand. AEOL sells hardware and materials, not software: it operates a single Korean-language
  Cafe24-hosted corporate site with no developer section, publishes no API documentation, SDK,
  webhook or machine-readable API contract of any kind, and maintains no public code repositories
  or package-registry releases.'
